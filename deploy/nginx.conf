server {
    listen 80;
    listen [::]:80;
    server_name nullusengine.com www.nullusengine.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nullus-acme;
    }

    location / {
        return 301 https://www.nullusengine.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nullusengine.com www.nullusengine.com;

    ssl_certificate /etc/letsencrypt/live/nullusengine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nullusengine.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/nullus-website/current;
    index index.html;

    if ($host = nullusengine.com) {
        return 301 https://www.nullusengine.com$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
